# ПРОДАКШЕН-ПРАКТИКА DOCKER COMPOSE:
# YAML-Якорь (&kafka-env) с общими переменными окружения для предотвращения дублирования кода.
x-kafka-env:
  &kafka-env # Включение режима KRaft (Kafka Raft Metadata Mode)
  KAFKA_PROCESS_ROLES: "broker,controller"
  KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka1:29091,2@kafka2:29092,3@kafka3:29093"
  KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT"
  KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
  KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"

  # НАСТРОЙКИ ОТКАЗОУСТОЙЧИВОСТИ КЛАСТЕРА:
  # Фактор репликации системного топика смещений (offsets) = 3
  KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "3"
  KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "3"

  # Минимальное число согласующихся реплик для транзакций = 2
  KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "2"

  # Фактор репликации по умолчанию для новых топиков = 3
  KAFKA_DEFAULT_REPLICATION_FACTOR: "3"

  # MIN_INSYNC_REPLICAS = 2: В комбинации с acks='all' гарантирует,
  # что запись будет подтверждена минимум 2 нодами из 3. Даже если 1 нода упадет, система продолжит работу!
  KAFKA_MIN_INSYNC_REPLICAS: "2"

  # Убирает задержку ребалансировки для быстрых тестов
  KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"

  # Автосоздание топиков при первом обращении
  KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  # Единая идентификация кластера KRaft
  CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"

# Общий шаблон сервисов (&kafka-common)
x-kafka-common: &kafka-common
  image: apache/kafka:4.3.1
  restart: unless-stopped
  networks:
    - kafka-net

services:
  kafka1:
    <<: *kafka-common
    container_name: kafka1
    ports:
      - "9091:9091"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "1"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:19091,EXTERNAL://0.0.0.0:9091,CONTROLLER://0.0.0.0:29091"
      # Внешний слуштель EXTERNAL подставляет localhost для подключения Python-приложений вне докера
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka1:19091,EXTERNAL://localhost:9091"
    volumes:
      - kafka1-data:/var/lib/kafka/data
    healthcheck:
      # Проверка доступности Kafka через CLI-команду списка топиков
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9091 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka2:
    <<: *kafka-common
    container_name: kafka2
    ports:
      - "9092:9092"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "2"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:19092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka2:19092,EXTERNAL://localhost:9092"
    volumes:
      - kafka2-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  kafka3:
    <<: *kafka-common
    container_name: kafka3
    ports:
      - "9093:9093"
    environment:
      <<: *kafka-env
      KAFKA_NODE_ID: "3"
      KAFKA_LISTENERS: "INTERNAL://0.0.0.0:19093,EXTERNAL://0.0.0.0:9093,CONTROLLER://0.0.0.0:29093"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka3:19093,EXTERNAL://localhost:9093"
    volumes:
      - kafka3-data:/var/lib/kafka/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9093 --list >/dev/null 2>&1",
        ]
      interval: 10s
      timeout: 5s
      retries: 15

  # Веб-интерфейс Kafdrop
  kafdrop:
    image: obsidiandynamics/kafdrop:4.0.1
    container_name: kafdrop
    ports:
      - "9000:9000"
    networks:
      - kafka-net
    environment:
      KAFKA_BROKERCONNECT: "kafka1:19091,kafka2:19092,kafka3:19093"
      JVM_OPTS: "-Xms32M -Xmx64M"
    depends_on:
      kafka1:
        condition: service_healthy
      kafka2:
        condition: service_healthy
      kafka3:
        condition: service_healthy
    restart: unless-stopped

volumes:
  kafka1-data:
  kafka2-data:
  kafka3-data:

networks:
  kafka-net:
    driver: bridge
