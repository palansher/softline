# Файл pyproject.toml размещается в корне проекта. Он позволяет зафиксировать единые правила линтинга и форматирования для всей команды, 
# редактора VS Code, Git-хуков и CI/CD пайплайнов.
# Это сбалансированная конфигурация для профессиональной разработки, включающая базовые проверки качества, 
# автосортировку импортов и современный синтаксис Python:

[tool.ruff]
# Минимальная поддерживаемая версия Python в проекте
target-version = "py311"

# Длина строки (88 — стандарт Black, 100 — оптимально для читаемости на широких мониторах)
line-length = 100

# Исключения из проверок (служебные директории и окружения)
exclude = [
    ".git",
    ".venv",
    "venv",
    "__pycache__",
    "build",
    "dist",
]

[tool.ruff.lint]
# Набор активных наборов правил (Linter Rules)
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes (ошибки синтаксиса, неиспользуемые переменные и импорты)
    "I",   # isort (сортировка импортов по группам)
    "B",   # flake8-bugbear (поиск вероятных багов и логических ошибок)
    "UP",  # pyupgrade (автоматический апгрейд синтаксиса под текущую версию Python)
    "N",   # pep8-naming (соблюдение стандартов именования классов/переменных)
    "SIM", # flake8-simplify (упрощение переусложненных `if/else` и условий)
    "C4",  # flake8-comprehensions (оптимизация работы со списками и словарями)
    "ARG", # flake8-unused-arguments (поиск неиспользуемых аргументов в функция)
    "PTH", # flake8-use-pathlib (рекомендация использовать pathlib вместо модуля os.path)
]

# Игнорируемые правила
ignore = [
    "E501", # Длина строки (за форматирование длинных строк отвечают правила format)
    "B008", # Разрешает вызовы функций в аргументах по умолчанию (необходимо при работе с FastAPI / Depends)
]

# Разрешить Ruff автоматически исправлять все указанные категории правил
# fixable = ["ALL"]

# Если вы хотите оставить автоматической только сортировку импортов, а остальное править вручную
fixable = ["I"] # Разрешить автофикс только для isort (группировка импортов)

[tool.ruff.lint.isort]
# Настройка групп импортов для isort
known-first-party = ["my_app"] # Укажите имя вашего основного пакета/модуля
combine-as-imports = true

[tool.ruff.format]
# Настройки форматировщика (заменяет Black)
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
